<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A1420" />
      <stop offset="50%" stop-color="#651F30" />
      <stop offset="100%" stop-color="#380C16" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D6" />
      <stop offset="35%" stop-color="#E5C378" />
      <stop offset="70%" stop-color="#C9A45C" />
      <stop offset="100%" stop-color="#9E782F" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background rounded squircle with gold border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2" />
  
  <!-- Inner delicate ornamental dashed frame -->
  <rect x="5.5" y="5.5" width="53" height="53" rx="13" fill="none" stroke="url(#goldGrad)" stroke-width="0.75" stroke-dasharray="2.5 1.5" opacity="0.65" />

  <!-- Top royal motif / sacred lotus -->
  <path d="M32 9 C30.5 12 28 13.5 28 15 C29.5 15 31.5 13.5 32 11 C32.5 13.5 34.5 15 36 15 C36 13.5 33.5 12 32 9 Z" fill="url(#goldGrad)" />
  <circle cx="32" cy="7.8" r="1.1" fill="#FFF3D6" />

  <!-- Monogram A & V -->
  <text x="21" y="42" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-size="23" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" filter="url(#softGlow)">A</text>
  
  <text x="32" y="38" font-family="'Great Vibes', 'Playfair Display', cursive, serif" font-size="14" font-style="italic" fill="#FFF3D6" text-anchor="middle" opacity="0.95">&amp;</text>
  
  <text x="43" y="42" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-size="23" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" filter="url(#softGlow)">V</text>

  <!-- Bottom ornamental flourish -->
  <path d="M22 47.5 Q32 50.5 42 47.5" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-linecap="round" opacity="0.8" />
  <circle cx="32" cy="49" r="1.2" fill="url(#goldGrad)" />
</svg>